name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ui:
    name: Svelte desktop UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Check UI types and accessibility
        working-directory: ui
        run: npm run check

      - name: Run UI tests
        working-directory: ui
        run: npm test

      - name: Audit locked UI dependencies
        working-directory: ui
        run: npm audit --audit-level=high

      - name: Build desktop UI
        working-directory: ui
        run: npm run build

  portable-core:
    name: Platform-neutral Rust core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: rust:1.95-trixie
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust quality components
        run: rustup component add clippy

      - name: Check without the legacy GTK frontend
        working-directory: native
        run: cargo check --locked --lib --no-default-features

      - name: Test without the legacy GTK frontend
        working-directory: native
        run: cargo test --locked --lib --tests --no-default-features

      - name: Lint without the legacy GTK frontend
        working-directory: native
        run: cargo clippy --locked --lib --tests --no-default-features -- -D warnings

  legacy-gtk:
    name: Deprecated GTK frontend still compiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: rust:1.95-trixie
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GTK build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc \
            libadwaita-1-dev \
            libgtk-4-dev \
            pkg-config

      - name: Compile the opt-in legacy frontend
        working-directory: native
        run: >-
          cargo check --locked --features legacy-gtk
          --bin video-harness-gtk --tests

      - name: Run legacy safety and deprecation contracts
        working-directory: native
        run: cargo test --locked --features legacy-gtk --lib --tests

  desktop-platforms:
    name: Desktop package and core (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025
            os: windows
            arch: x86_64
          - platform: macOS Apple Silicon
            runner: macos-26
            os: macos
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup component add --toolchain 1.95 clippy

      - name: Install Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build desktop UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Check without the legacy GTK frontend
        working-directory: native
        run: cargo +1.95 check --locked --all-targets --no-default-features

      - name: Test platform-specific core behavior
        working-directory: native
        shell: bash
        run: |
          bash ../.github/scripts/run-with-annotation.sh \
            "Core tests (${{ matrix.platform }})" \
            cargo +1.95 test --locked --lib --tests --no-default-features

      - name: Lint platform-specific core code
        working-directory: native
        run: cargo +1.95 clippy --locked --lib --tests --no-default-features -- -D warnings

      - name: Check Tauri desktop shell
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          bash ../../.github/scripts/run-with-annotation.sh \
            "Tauri check (${{ matrix.platform }})" \
            cargo +1.95 check --locked --all-targets

      - name: Test Tauri desktop shell
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          bash ../../.github/scripts/run-with-annotation.sh \
            "Tauri tests (${{ matrix.platform }})" \
            cargo +1.95 test --locked

      - name: Build unsigned Windows NSIS installer
        if: matrix.os == 'windows'
        working-directory: desktop
        shell: bash
        run: >-
          ../ui/node_modules/.bin/tauri build
          --ci --no-sign --bundles nsis -- --locked

      - name: Verify the bundled Microsoft WebView2 runtime
        if: matrix.os == 'windows'
        shell: pwsh
        run: >-
          ./packaging/verify-webview2-offline-installer.ps1
          -TargetDirectory desktop/src-tauri/target

      - name: Validate and collect Windows NSIS installer
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          trap {
            $message = $_.Exception.Message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=Windows package validation::$message"
            exit 1
          }
          function Assert-VersionSmoke {
            param(
              [Parameter(Mandatory = $true)] [string] $Executable,
              [Parameter(Mandatory = $true)] [string] $Label
            )
            # PowerShell does not reliably wait for Windows GUI-subsystem
            # executables when they are invoked with `&`. Start the process
            # explicitly so its real exit code, rather than a stale or null
            # $LASTEXITCODE, controls the smoke check.
            $process = Start-Process -FilePath $Executable `
              -ArgumentList @("--version") -PassThru
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "$Label version smoke timed out after 30 seconds"
            }
            if ($process.ExitCode -ne 0) {
              throw "$Label version smoke failed with exit code $($process.ExitCode)"
            }
          }
          $binary = "desktop/src-tauri/target/release/video-harness.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "release executable was not built"
          }
          Assert-VersionSmoke -Executable $binary -Label "release executable"
          $nsis = @(Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis" -File -Filter "*.exe")
          if ($nsis.Count -ne 1) {
            throw "expected exactly one NSIS installer"
          }

          # Exercise the packaged install path, not only the raw Cargo output.
          $nsisRoot = Join-Path $env:RUNNER_TEMP "video-harness-nsis-smoke"
          if ($nsisRoot.Contains(" ")) {
            throw "NSIS /D smoke path must not contain spaces: $nsisRoot"
          }
          $install = Start-Process -FilePath $nsis[0].FullName `
            -ArgumentList @("/S", "/D=$nsisRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "silent NSIS install failed with exit code $($install.ExitCode)"
          }
          $installed = @(Get-ChildItem $nsisRoot -Recurse -File `
            -Filter "video-harness.exe")
          if ($installed.Count -ne 1) {
            throw "silent NSIS install did not produce one app executable"
          }
          Assert-VersionSmoke -Executable $installed[0].FullName `
            -Label "installed NSIS executable"
          $launched = Start-Process -FilePath $installed[0].FullName -PassThru
          Start-Sleep -Seconds 5
          if ($launched.HasExited) {
            throw "installed NSIS application exited before its WebView launch smoke completed"
          }
          Stop-Process -Id $launched.Id -Force
          $uninstallers = @(Get-ChildItem $nsisRoot -Recurse -File `
            -Filter "uninstall*.exe")
          if ($uninstallers.Count -ne 1) {
            throw "silent NSIS install did not produce one uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstallers[0].FullName `
            -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "silent NSIS uninstall failed with exit code $($uninstall.ExitCode)"
          }

          $destination = Join-Path $env:RUNNER_TEMP "desktop-smoke-windows-x86_64"
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item -LiteralPath $nsis[0].FullName -Destination $destination

      - name: Upload unsigned Windows installer smoke artifact
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-windows-x86_64
          path: ${{ runner.temp }}/desktop-smoke-windows-x86_64/*
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned macOS application and disk image
        if: matrix.os == 'macos'
        working-directory: desktop
        shell: bash
        run: >-
          ../ui/node_modules/.bin/tauri build
          --ci --no-sign --bundles app,dmg -- --locked

      - name: Validate macOS app and collect DMG
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          apps=(desktop/src-tauri/target/release/bundle/macos/*.app)
          images=(desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          [[ "${#apps[@]}" -eq 1 && -d "${apps[0]}" ]]
          [[ "${#images[@]}" -eq 1 && -f "${images[0]}" ]]
          app_path="${apps[0]}"
          dmg_path="${images[0]}"
          executable="${app_path}/Contents/MacOS/video-harness"
          [[ -x "${executable}" ]]
          [[ "$(lipo -archs "${executable}")" == arm64 ]]
          "${executable}" --version
          hdiutil verify "${dmg_path}"

          # Mount the actual DMG and start its packaged WebView application.
          mount_dir="${RUNNER_TEMP}/video-harness-dmg-smoke"
          smoke_log="${RUNNER_TEMP}/video-harness-macos-smoke.log"
          mkdir -p "${mount_dir}"
          mounted=false
          app_pid=""
          cleanup_smoke() {
            if [[ -n "${app_pid}" ]] && kill -0 "${app_pid}" 2>/dev/null; then
              kill "${app_pid}" 2>/dev/null || true
              wait "${app_pid}" 2>/dev/null || true
            fi
            if [[ "${mounted}" == true ]]; then
              hdiutil detach "${mount_dir}" -quiet || true
            fi
            rm -f "${smoke_log}"
          }
          trap cleanup_smoke EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "${mount_dir}" "${dmg_path}"
          mounted=true
          mounted_apps=("${mount_dir}"/*.app)
          [[ "${#mounted_apps[@]}" -eq 1 && -d "${mounted_apps[0]}" ]]
          mounted_executable="${mounted_apps[0]}/Contents/MacOS/video-harness"
          [[ "$(lipo -archs "${mounted_executable}")" == arm64 ]]
          "${mounted_executable}" --version
          "${mounted_executable}" >"${smoke_log}" 2>&1 &
          app_pid=$!
          sleep 5
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            tail -n 25 "${smoke_log}" >&2 || true
            echo "Packaged macOS application exited before its WebView launch smoke completed" >&2
            exit 1
          fi
          kill "${app_pid}"
          wait "${app_pid}" 2>/dev/null || true
          app_pid=""
          hdiutil detach "${mount_dir}" -quiet
          mounted=false
          rm -f "${smoke_log}"
          trap - EXIT

          destination="${RUNNER_TEMP}/desktop-smoke-macos-${{ matrix.arch }}"
          mkdir -p "${destination}"
          cp "${dmg_path}" "${destination}/Video-Harness.dmg"

      - name: Upload unsigned macOS DMG smoke artifact
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/desktop-smoke-macos-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 7

      - name: Require reproducible lockfiles
        shell: bash
        run: >-
          git diff --exit-code --
          desktop/src-tauri/Cargo.lock
          native/Cargo.lock
          ui/package-lock.json

  desktop-linux:
    name: Tauri desktop shell (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup component add --toolchain 1.95 rustfmt clippy

      - name: Install Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build desktop UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo +1.95 fmt --check

      - name: Check Tauri desktop shell
        working-directory: desktop/src-tauri
        run: cargo +1.95 check --locked

      - name: Test Tauri desktop shell
        working-directory: desktop/src-tauri
        run: cargo +1.95 test --locked

      - name: Lint Tauri desktop shell
        working-directory: desktop/src-tauri
        run: cargo +1.95 clippy --locked --all-targets -- -D warnings

      - name: Smoke-test Tauri release archive assembly
        run: |
          cargo +1.95 build --locked \
            --manifest-path desktop/src-tauri/Cargo.toml \
            --bin video-harness
          desktop/src-tauri/target/debug/video-harness --version
          SOURCE_DATE_EPOCH=0 packaging/build-tarball.sh \
            --binary desktop/src-tauri/target/debug/video-harness \
            --output-dir "${RUNNER_TEMP}/video-harness-dist"
          tar -tJf "${RUNNER_TEMP}/video-harness-dist/"*.tar.xz \
            | grep -F '/native/bin/video-harness'

  quality:
    name: Rust, metadata, and installers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: rust:1.95-trixie
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native build and validation dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream \
            desktop-file-utils \
            gcc \
            pkg-config

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Validate release metadata
        run: packaging/check-release-version.sh

      - name: Check formatting
        working-directory: native
        run: cargo fmt --check

      - name: Lint the platform-neutral core
        working-directory: native
        run: cargo clippy --locked --lib --tests --no-default-features -- -D warnings

      - name: Run deterministic core test suite
        working-directory: native
        run: cargo test --locked --lib --tests --no-default-features

      - name: Smoke-test architecture-neutral installer
        run: packaging/test-installer.sh

  dependency-audit:
    name: Locked Rust dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: rust:1.95-trixie
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit the native dependency lockfile
        run: .github/scripts/audit-rust-lockfile.sh native/Cargo.toml native/Cargo.lock

      - name: Audit the desktop dependency lockfile
        run: >-
          .github/scripts/audit-rust-lockfile.sh
          desktop/src-tauri/Cargo.toml
          desktop/src-tauri/Cargo.lock

  dependency-review:
    name: New dependency vulnerability and license policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0,
            CDLA-Permissive-2.0, ISC, LGPL-2.1-or-later, MIT, MIT-0,
            MPL-2.0, Unicode-3.0, Unlicense, Zlib

  appimage:
    name: Portable AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-tools \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal

      - name: Install Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build locked desktop UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Build and validate unsigned AppImage
        env:
          RUSTUP_TOOLCHAIN: "1.95"
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct)"
          export SOURCE_DATE_EPOCH
          bash .github/scripts/run-with-annotation.sh \
            "AppImage build (${{ matrix.arch }})" \
            packaging/build-appimage.sh \
              --output-dir "${RUNNER_TEMP}/video-harness-dist"
          git diff --exit-code -- \
            desktop/src-tauri/Cargo.lock native/Cargo.lock ui/package-lock.json

      - name: Upload portable CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage-${{ matrix.arch }}
          path: ${{ runner.temp }}/video-harness-dist/Video-Harness-*.AppImage
          if-no-files-found: error
          retention-days: 7

  appimage-runtime:
    name: Clean AppImage runtime (${{ matrix.arch }})
    needs: appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container: ubuntu:22.04
    steps:
      - name: Install AppImage host baseline and headless smoke dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            dbus-daemon \
            fontconfig \
            libasound2 \
            libdrm2 \
            libegl1 \
            libexpat1 \
            libfribidi0 \
            libgbm1 \
            libgcc-s1 \
            libgl1 \
            libgl1-mesa-dri \
            libgmp10 \
            libgpg-error0 \
            gstreamer1.0-tools \
            libharfbuzz0b \
            libice6 \
            libjack-jackd2-0 \
            libpipewire-0.3-0 \
            libsm6 \
            libstdc++6 \
            libusb-1.0-0 \
            libuuid1 \
            libwayland-client0 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            xauth \
            xdotool \
            xvfb \
            zlib1g

      - name: Check out smoke-test script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download matching portable executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appimage-${{ matrix.arch }}
          path: appimage-under-test

      - name: Decode bundled media and require a visible application window
        run: |
          chmod +x appimage-under-test/Video-Harness-*.AppImage
          appimage_path="$(realpath appimage-under-test/Video-Harness-*.AppImage)"
          extract_root="${RUNNER_TEMP}/appimage-extracted"
          mkdir -p -- "${extract_root}"
          (
            cd -- "${extract_root}"
            "${appimage_path}" --appimage-extract >/dev/null
          )
          bash .github/scripts/run-with-annotation.sh \
            "Clean bundled media decode (${{ matrix.arch }})" \
            packaging/smoke-appimage-media.sh \
              "${extract_root}/squashfs-root"
          bash .github/scripts/run-with-annotation.sh \
            "Clean AppImage runtime (${{ matrix.arch }})" \
            packaging/smoke-appimage-gui.sh \
              appimage-under-test/Video-Harness-*.AppImage
