name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ui:
    name: Svelte desktop UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Check UI types and accessibility
        working-directory: ui
        run: npm run check

      - name: Run UI tests
        working-directory: ui
        run: npm test

      - name: Build desktop UI
        working-directory: ui
        run: npm run build

  portable-core:
    name: Platform-neutral Rust core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: rust:1.95-trixie
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust quality components
        run: rustup component add clippy

      - name: Check without the legacy GTK frontend
        working-directory: native
        run: cargo check --locked --lib --no-default-features

      - name: Test without the legacy GTK frontend
        working-directory: native
        run: cargo test --locked --lib --tests --no-default-features

      - name: Lint without the legacy GTK frontend
        working-directory: native
        run: cargo clippy --locked --lib --tests --no-default-features -- -D warnings

  future-platform-core:
    name: Desktop shell and core (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025
          - platform: macOS x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build desktop UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Check without the legacy GTK frontend
        working-directory: native
        run: cargo +1.95 check --locked --lib --no-default-features

      - name: Test platform-specific core behavior
        working-directory: native
        run: cargo +1.95 test --locked --lib --no-default-features

      - name: Check Tauri desktop shell
        working-directory: desktop/src-tauri
        run: cargo +1.95 check --locked

      - name: Test Tauri desktop shell
        working-directory: desktop/src-tauri
        run: cargo +1.95 test --locked

  desktop-linux:
    name: Tauri desktop shell (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup component add --toolchain 1.95 rustfmt clippy

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build desktop UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo +1.95 fmt --check

      - name: Check Tauri desktop shell
        working-directory: desktop/src-tauri
        run: cargo +1.95 check --locked

      - name: Test Tauri desktop shell
        working-directory: desktop/src-tauri
        run: cargo +1.95 test --locked

      - name: Lint Tauri desktop shell
        working-directory: desktop/src-tauri
        run: cargo +1.95 clippy --locked --all-targets -- -D warnings

      - name: Smoke-test Tauri release archive assembly
        run: |
          cargo +1.95 build --locked \
            --manifest-path desktop/src-tauri/Cargo.toml \
            --bin video-harness
          desktop/src-tauri/target/debug/video-harness --version
          SOURCE_DATE_EPOCH=0 packaging/build-tarball.sh \
            --binary desktop/src-tauri/target/debug/video-harness \
            --output-dir "${RUNNER_TEMP}/video-harness-dist"
          tar -tJf "${RUNNER_TEMP}/video-harness-dist/"*.tar.xz \
            | grep -F '/native/bin/video-harness'

  quality:
    name: Rust, metadata, and installers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: rust:1.95-trixie
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install native build and validation dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream \
            desktop-file-utils \
            gcc \
            pkg-config

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Validate release and Flatpak metadata
        run: packaging/check-release-version.sh

      - name: Check formatting
        working-directory: native
        run: cargo fmt --check

      - name: Lint the platform-neutral core
        working-directory: native
        run: cargo clippy --locked --lib --tests --no-default-features -- -D warnings

      - name: Run deterministic core test suite
        working-directory: native
        run: cargo test --locked --lib --tests --no-default-features

      - name: Smoke-test architecture-neutral installer
        run: packaging/test-installer.sh

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build locked desktop UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install pinned SDK, runtime, and codecs
        run: |
          flatpak --user install -y flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Platform.codecs-extra//25.08-extra

      - name: Validate manifest
        run: flatpak/check-manifest.sh

      - name: Build unsigned Flatpak repository
        run: |
          flatpak-builder --user --force-clean --arch=${{ matrix.arch }} \
            --default-branch=stable \
            --repo=flatpak-repo flatpak-build \
            flatpak/io.github.EnchiladaBoy.VideoHarness.yml

      - name: Install and smoke-test local ref
        run: |
          flatpak --user remote-add --if-not-exists --no-gpg-verify \
            video-harness-ci "file://${PWD}/flatpak-repo"
          flatpak --user install -y video-harness-ci \
            io.github.EnchiladaBoy.VideoHarness//stable
          flatpak --user run io.github.EnchiladaBoy.VideoHarness --version
          flatpak --user run --command=sh io.github.EnchiladaBoy.VideoHarness \
            -c 'gst-inspect-1.0 avdec_h264'
          flatpak --user info --show-permissions \
            io.github.EnchiladaBoy.VideoHarness | tee flatpak-permissions.txt
          flatpak/check-installed-permissions.sh flatpak-permissions.txt

      - name: Build unsigned smoke-test bundle
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' native/Cargo.toml | head -n 1)"
          flatpak build-bundle \
            --arch="${RELEASE_ARCH}" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "VideoHarness-${VERSION}-${RELEASE_ARCH}.flatpak" \
            io.github.EnchiladaBoy.VideoHarness stable

      - name: Upload unsigned CI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flatpak-${{ matrix.arch }}
          path: |
            VideoHarness-*.flatpak
            flatpak-permissions.txt
          if-no-files-found: error
          retention-days: 7
