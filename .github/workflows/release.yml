name: Desktop release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag, CI, and metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    outputs:
      tag_commit: ${{ steps.release_tag.outputs.tag_commit }}
      tag_object: ${{ steps.release_tag.outputs.tag_object }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source and tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require an annotated tag from main
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          fail() {
            echo "::error title=Release tag verification::$*"
            exit 1
          }
          TAG_TYPE="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq '.object.type')"
          if [[ "${TAG_TYPE}" != tag ]]; then
            fail "${RELEASE_TAG} must be an annotated tag"
          fi
          TAG_OBJECT="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq '.object.sha')"
          TAG_TARGET_TYPE="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" \
            --jq '.object.type')"
          if [[ "${TAG_TARGET_TYPE}" != commit ]]; then
            fail "${RELEASE_TAG} must point directly to a commit"
          fi
          TAG_COMMIT="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" \
            --jq '.object.sha')"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" FETCH_HEAD; then
            fail "${RELEASE_TAG} is not attached to a commit on main"
          fi
          git checkout --detach "${TAG_COMMIT}"
          [[ "$(git rev-parse HEAD)" == "${TAG_COMMIT}" ]] \
            || fail "could not check out the verified release commit"
          echo "TAG_COMMIT=${TAG_COMMIT}" >>"${GITHUB_ENV}"
          {
            echo "tag_commit=${TAG_COMMIT}"
            echo "tag_object=${TAG_OBJECT}"
          } >>"${GITHUB_OUTPUT}"

      - name: Require successful full CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() {
            echo "::error title=Release CI gate::$*"
            exit 1
          }
          deadline=$((SECONDS + 5400))
          while (( SECONDS < deadline )); do
            run_record="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="${TAG_COMMIT}" \
              -f event=push \
              -f per_page=100 \
              --jq '.workflow_runs
                | sort_by(.run_number)
                | last // empty
                | "\(.id)\t\(.head_sha)\t\(.status)\t\(.conclusion // \"pending\")\t\(.updated_at)\t\(.html_url)"')"
            if [[ -z "${run_record}" ]]; then
              echo "Waiting for a CI push run for ${TAG_COMMIT}..."
              sleep 15
              continue
            fi
            IFS=$'\t' read -r run_id run_sha run_status run_conclusion run_updated_at run_url \
              <<<"${run_record}"
            [[ "${run_sha}" == "${TAG_COMMIT}" ]] \
              || fail "GitHub returned CI for unexpected commit ${run_sha}"
            if [[ "${run_status}" == completed ]]; then
              [[ "${run_conclusion}" == success ]] \
                || fail "CI run ${run_id} concluded ${run_conclusion}: ${run_url}"
              run_updated_epoch="$(date --date="${run_updated_at}" +%s)" \
                || fail "CI run ${run_id} has an invalid updated_at value"
              oldest_allowed_epoch="$(( $(date -u +%s) - 7 * 24 * 60 * 60 ))"
              (( run_updated_epoch >= oldest_allowed_epoch )) \
                || fail "CI run ${run_id} is older than seven days; rerun it before releasing: ${run_url}"
              echo "Exact tagged commit passed full CI: ${run_url}"
              exit 0
            fi
            echo "Waiting for CI run ${run_id} (${run_status}): ${run_url}"
            sleep 15
          done
          fail "no successful CI push run completed for ${TAG_COMMIT} within 90 minutes"

      - name: Install metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils

      - name: Match tag and release metadata
        run: packaging/check-release-version.sh "${GITHUB_REF_NAME}"

      - name: Install Rust 1.95 for the release-time advisory check
        run: rustup toolchain install 1.95 --profile minimal

      - name: Install pinned cargo-audit
        env:
          RUSTUP_TOOLCHAIN: "1.95"
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit both locked Rust dependency graphs again
        env:
          RUSTUP_TOOLCHAIN: "1.95"
        run: |
          .github/scripts/audit-rust-lockfile.sh native/Cargo.toml native/Cargo.lock
          .github/scripts/audit-rust-lockfile.sh \
            desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock

      - name: Install Node.js 24.18.0 for the release-time advisory check
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Audit the locked UI dependency graph again
        working-directory: ui
        run: npm audit --package-lock-only --audit-level=high

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists and is immutable" >&2
            exit 1
          fi

  build-linux:
    name: Build portable Linux executable (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag_commit }}

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-tools \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal

      - name: Install Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build locked desktop UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Build and validate unsigned AppImage
        env:
          RUSTUP_TOOLCHAIN: "1.95"
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct)"
          export SOURCE_DATE_EPOCH
          bash .github/scripts/run-with-annotation.sh \
            "AppImage build (${{ matrix.arch }})" \
            packaging/build-appimage.sh
          git diff --exit-code -- \
            desktop/src-tauri/Cargo.lock native/Cargo.lock ui/package-lock.json

      - name: Upload portable executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/Video-Harness-*-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Unsigned Windows NSIS installer (x86_64)
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag_commit }}

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal

      - name: Install Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build locked desktop UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Build unsigned NSIS installer
        working-directory: desktop
        shell: bash
        run: >-
          ../ui/node_modules/.bin/tauri build
          --ci --no-sign --bundles nsis -- --locked

      - name: Verify the bundled Microsoft WebView2 runtime
        shell: pwsh
        run: >-
          ./packaging/verify-webview2-offline-installer.ps1
          -TargetDirectory desktop/src-tauri/target

      - name: Validate and collect the Windows release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          trap {
            $message = $_.Exception.Message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=Windows release validation::$message"
            exit 1
          }
          function Assert-VersionSmoke {
            param(
              [Parameter(Mandatory = $true)] [string] $Executable,
              [Parameter(Mandatory = $true)] [string] $Label
            )
            $process = Start-Process -FilePath $Executable `
              -ArgumentList @("--version") -PassThru
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "$Label version smoke timed out after 30 seconds"
            }
            if ($process.ExitCode -ne 0) {
              throw "$Label version smoke failed with exit code $($process.ExitCode)"
            }
          }
          $binaryPath = "desktop/src-tauri/target/release/video-harness.exe"
          if (-not (Test-Path -LiteralPath $binaryPath -PathType Leaf)) {
            throw "release executable was not built"
          }
          $binary = Get-Item -LiteralPath $binaryPath
          $nsis = @(Get-ChildItem `
            "desktop/src-tauri/target/release/bundle/nsis" `
            -File -Filter "*.exe")
          if ($nsis.Count -ne 1) {
            throw "expected exactly one NSIS installer"
          }
          Assert-VersionSmoke -Executable $binary.FullName `
            -Label "release executable"

          # Exercise install, launch, and uninstall using the exact package
          # that will be published.
          $installRoot = Join-Path $env:RUNNER_TEMP "video-harness-release-smoke"
          if ($installRoot.Contains(" ")) {
            throw "NSIS /D smoke path must not contain spaces: $installRoot"
          }
          $install = Start-Process -FilePath $nsis[0].FullName `
            -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "silent NSIS install failed with exit code $($install.ExitCode)"
          }
          $installed = @(Get-ChildItem $installRoot -Recurse -File `
            -Filter "video-harness.exe")
          if ($installed.Count -ne 1) {
            throw "silent NSIS install did not produce one app executable"
          }
          Assert-VersionSmoke -Executable $installed[0].FullName `
            -Label "installed NSIS executable"
          $launched = Start-Process -FilePath $installed[0].FullName -PassThru
          Start-Sleep -Seconds 5
          if ($launched.HasExited) {
            throw "installed NSIS application exited before its WebView launch smoke completed"
          }
          Stop-Process -Id $launched.Id -Force
          $uninstallers = @(Get-ChildItem $installRoot -Recurse -File `
            -Filter "uninstall*.exe")
          if ($uninstallers.Count -ne 1) {
            throw "silent NSIS install did not produce one uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstallers[0].FullName `
            -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "silent NSIS uninstall failed with exit code $($uninstall.ExitCode)"
          }

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $destination = Join-Path $env:RUNNER_TEMP "windows-release"
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item -LiteralPath $nsis[0].FullName -Destination `
            (Join-Path $destination "Video-Harness-$version-windows-x86_64-setup.exe")

      - name: Require reproducible lockfiles
        shell: bash
        run: >-
          git diff --exit-code --
          desktop/src-tauri/Cargo.lock
          native/Cargo.lock
          ui/package-lock.json

      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x86_64
          path: ${{ runner.temp }}/windows-release/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Unsigned macOS disk image (Apple Silicon)
    needs: verify
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag_commit }}

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal

      - name: Install Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build locked desktop UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Build unsigned macOS disk image
        working-directory: desktop
        shell: bash
        run: >-
          ../ui/node_modules/.bin/tauri build
          --ci --no-sign --bundles app,dmg -- --locked

      - name: Validate and collect the macOS release asset
        shell: bash
        run: |
          set -euo pipefail
          apps=(desktop/src-tauri/target/release/bundle/macos/*.app)
          images=(desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          [[ "${#apps[@]}" -eq 1 && -d "${apps[0]}" ]]
          [[ "${#images[@]}" -eq 1 && -f "${images[0]}" ]]
          app_path="${apps[0]}"
          dmg_path="${images[0]}"
          executable="${app_path}/Contents/MacOS/video-harness"
          [[ -x "${executable}" ]]
          [[ "$(lipo -archs "${executable}")" == arm64 ]]
          "${executable}" --version
          hdiutil verify "${dmg_path}"

          # Mount and launch the exact DMG that will be published.
          mount_dir="${RUNNER_TEMP}/video-harness-release-dmg-smoke"
          smoke_log="${RUNNER_TEMP}/video-harness-release-macos-smoke.log"
          mkdir -p "${mount_dir}"
          mounted=false
          app_pid=""
          cleanup_smoke() {
            if [[ -n "${app_pid}" ]] && kill -0 "${app_pid}" 2>/dev/null; then
              kill "${app_pid}" 2>/dev/null || true
              wait "${app_pid}" 2>/dev/null || true
            fi
            if [[ "${mounted}" == true ]]; then
              hdiutil detach "${mount_dir}" -quiet || true
            fi
            rm -f "${smoke_log}"
          }
          trap cleanup_smoke EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "${mount_dir}" "${dmg_path}"
          mounted=true
          mounted_apps=("${mount_dir}"/*.app)
          [[ "${#mounted_apps[@]}" -eq 1 && -d "${mounted_apps[0]}" ]]
          mounted_executable="${mounted_apps[0]}/Contents/MacOS/video-harness"
          [[ "$(lipo -archs "${mounted_executable}")" == arm64 ]]
          "${mounted_executable}" --version
          "${mounted_executable}" >"${smoke_log}" 2>&1 &
          app_pid=$!
          sleep 5
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            tail -n 25 "${smoke_log}" >&2 || true
            echo "Packaged macOS application exited before its WebView launch smoke completed" >&2
            exit 1
          fi
          kill "${app_pid}"
          wait "${app_pid}" 2>/dev/null || true
          app_pid=""
          hdiutil detach "${mount_dir}" -quiet
          mounted=false
          rm -f "${smoke_log}"
          trap - EXIT

          destination="${RUNNER_TEMP}/macos-release"
          mkdir -p "${destination}"
          cp "${dmg_path}" \
            "${destination}/Video-Harness-${GITHUB_REF_NAME#v}-macos-aarch64.dmg"

      - name: Require reproducible lockfiles
        shell: bash
        run: >-
          git diff --exit-code --
          desktop/src-tauri/Cargo.lock
          native/Cargo.lock
          ui/package-lock.json

      - name: Upload unsigned macOS disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-aarch64
          path: ${{ runner.temp }}/macos-release/*
          if-no-files-found: error
          retention-days: 7

  runtime-smoke:
    name: Clean AppImage runtime (${{ matrix.arch }})
    needs: [verify, build-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container: ubuntu:22.04
    permissions:
      contents: read
    steps:
      - name: Install AppImage host baseline and headless smoke dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            dbus-daemon \
            fontconfig \
            libasound2 \
            libdrm2 \
            libegl1 \
            libexpat1 \
            libfribidi0 \
            libgbm1 \
            libgcc-s1 \
            libgl1 \
            libgl1-mesa-dri \
            libgmp10 \
            libgpg-error0 \
            gstreamer1.0-tools \
            libharfbuzz0b \
            libice6 \
            libjack-jackd2-0 \
            libpipewire-0.3-0 \
            libsm6 \
            libstdc++6 \
            libusb-1.0-0 \
            libuuid1 \
            libwayland-client0 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            xauth \
            xdotool \
            xvfb \
            zlib1g

      - name: Check out smoke-test script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag_commit }}

      - name: Download matching portable executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: appimage-under-test

      - name: Decode bundled media and require a visible application window
        run: |
          chmod +x appimage-under-test/Video-Harness-*.AppImage
          appimage_path="$(realpath appimage-under-test/Video-Harness-*.AppImage)"
          extract_root="${RUNNER_TEMP}/appimage-extracted"
          mkdir -p -- "${extract_root}"
          (
            cd -- "${extract_root}"
            "${appimage_path}" --appimage-extract >/dev/null
          )
          bash .github/scripts/run-with-annotation.sh \
            "Clean bundled media decode (${{ matrix.arch }})" \
            packaging/smoke-appimage-media.sh \
              "${extract_root}/squashfs-root"
          bash .github/scripts/run-with-annotation.sh \
            "Clean AppImage runtime (${{ matrix.arch }})" \
            packaging/smoke-appimage-gui.sh \
              appimage-under-test/Video-Harness-*.AppImage

  publish:
    name: Publish verified desktop packages
    needs:
      - verify
      - build-linux
      - runtime-smoke
      - build-windows
      - build-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag_commit }}
          persist-credentials: false

      - name: Download all verified platform builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate a pinned SPDX dependency and artifact SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/Video-Harness-${{ github.ref_name }}.spdx.json
          syft-version: v1.40.1
          upload-artifact: false
          upload-release-assets: false

      - name: Validate release inputs and write checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected_files=(
            "Video-Harness-${version}-linux-aarch64.AppImage"
            "Video-Harness-${version}-linux-x86_64.AppImage"
            "Video-Harness-${version}-macos-aarch64.dmg"
            "Video-Harness-${version}-windows-x86_64-setup.exe"
            "Video-Harness-${GITHUB_REF_NAME}.spdx.json"
          )
          mapfile -t actual_files < <(find release-assets -mindepth 1 \
            -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${#actual_files[@]}" -eq "${#expected_files[@]}" ]]
          [[ "$(find release-assets -mindepth 1 -maxdepth 1 ! -type f \
            -print -quit)" == "" ]]
          for index in "${!expected_files[@]}"; do
            [[ "${actual_files[index]}" == "${expected_files[index]}" ]]
            test -s "release-assets/${expected_files[index]}"
          done
          (
            cd release-assets
            sha256sum Video-Harness-* >SHA256SUMS
          )

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/*

      - name: Create GitHub release
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.verify.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          generated_notes="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" \
            -f target_commitish="${EXPECTED_TAG_COMMIT}" \
            --jq '.body')"
          {
            cat <<EOF
          > [!WARNING]
          > **These binaries are not platform code-signed or notarized.** Windows SmartScreen may warn before opening the setup executable, and macOS Gatekeeper may block the DMG app on first launch. Only continue if you downloaded the package from this release.

          Verify downloads with [SHA256SUMS](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SHA256SUMS) and the repository's [GitHub build attestations](https://github.com/${GITHUB_REPOSITORY}/attestations) before running them. Follow the [platform-specific verification and installation guide](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/packaging/PLATFORM-RELEASES.md#verify-a-release-before-running-it); do not disable SmartScreen or Gatekeeper globally.

          EOF
            printf '%s\n' "${generated_notes}"
          } >release-notes.md
          current_object="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq '.object.sha')"
          current_commit="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/${current_object}" \
            --jq '.object.sha')"
          [[ "${current_object}" == "${EXPECTED_TAG_OBJECT}" ]] || {
            echo "::error title=Release tag changed::${RELEASE_TAG} moved after verification"
            exit 1
          }
          [[ "${current_commit}" == "${EXPECTED_TAG_COMMIT}" ]] || {
            echo "::error title=Release commit changed::${RELEASE_TAG} no longer names the verified commit"
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_TAG_COMMIT}" ]]
          gh release create "${RELEASE_TAG}" release-assets/* \
            --verify-tag \
            --title "Video Harness ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
