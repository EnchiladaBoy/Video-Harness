name: Portable Linux release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag and metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source and tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require an unsigned annotated tag from main
        run: |
          [[ "$(git cat-file -t "${GITHUB_REF}")" == tag ]]
          if git cat-file -p "${GITHUB_REF}" \
            | grep -Eq -- '-----BEGIN (PGP|SSH) SIGNATURE-----'; then
            echo "Release tags must be unsigned" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_REF}^{commit}" origin/main

      - name: Install metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils

      - name: Match tag and release metadata
        run: packaging/check-release-version.sh "${GITHUB_REF_NAME}"

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists and is immutable" >&2
            exit 1
          fi

  build:
    name: Build portable Linux executable (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build locked desktop UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Build and validate unsigned AppImage
        env:
          RUSTUP_TOOLCHAIN: "1.95"
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct)"
          export SOURCE_DATE_EPOCH
          bash .github/scripts/run-with-annotation.sh \
            "AppImage build (${{ matrix.arch }})" \
            packaging/build-appimage.sh
          git diff --exit-code -- \
            desktop/src-tauri/Cargo.lock native/Cargo.lock ui/package-lock.json

      - name: Upload portable executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/Video-Harness-*-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          retention-days: 7

  runtime-smoke:
    name: Clean AppImage runtime (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container: ubuntu:22.04
    permissions:
      contents: read
    steps:
      - name: Install only headless desktop smoke dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            dbus-daemon \
            xauth \
            xdotool \
            xvfb

      - name: Check out smoke-test script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download matching portable executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: appimage-${{ matrix.arch }}
          path: appimage-under-test

      - name: Require an actual visible application window
        run: |
          chmod +x appimage-under-test/Video-Harness-*.AppImage
          bash .github/scripts/run-with-annotation.sh \
            "Clean AppImage runtime (${{ matrix.arch }})" \
            packaging/smoke-appimage-gui.sh \
              appimage-under-test/Video-Harness-*.AppImage

  publish:
    name: Publish portable executables
    needs: [verify, build, runtime-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download both architecture builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: appimage-*
          path: release-assets
          merge-multiple: true

      - name: Validate release inputs and write checksums
        run: |
          mapfile -t appimages < <(find release-assets -maxdepth 1 \
            -type f -name 'Video-Harness-*.AppImage' -print | sort)
          [[ "${#appimages[@]}" -eq 2 ]]
          test -f "release-assets/Video-Harness-${GITHUB_REF_NAME#v}-linux-x86_64.AppImage"
          test -f "release-assets/Video-Harness-${GITHUB_REF_NAME#v}-linux-aarch64.AppImage"
          (
            cd release-assets
            sha256sum Video-Harness-*.AppImage >SHA256SUMS
          )

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-assets/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            --title "Video Harness ${GITHUB_REF_NAME#v}" \
            --generate-notes
