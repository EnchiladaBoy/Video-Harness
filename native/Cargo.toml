[package]
name = "openrouter-video-studio-native"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A safe multi-provider terminal client for AI video generation"
license = "MIT"
publish = false

[lib]
name = "openrouter_video_studio"
path = "src/lib.rs"

[[bin]]
name = "openrouter-video"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
bytes = "1.10"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.31"
httpdate = "1.0.3"
keyring = "4.1"
ratatui = "0.30.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.0", features = ["backup", "bundled"] }
rust_decimal = { version = "1.40", features = ["serde-with-str"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
unicode-normalization = "0.1.25"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
