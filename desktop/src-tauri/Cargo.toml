[package]
name = "video-harness-desktop"
version = "0.7.1"
edition = "2024"
rust-version = "1.95"
description = "Tauri desktop shell for Video Harness"
license = "MIT"
repository = "https://github.com/EnchiladaBoy/Video-Harness"
publish = false

[lib]
name = "video_harness_desktop"
path = "src/lib.rs"

[[bin]]
name = "video-harness"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
percent-encoding = "2"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.49", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
video-harness = { path = "../../native", default-features = false }
zeroize = "1"

[profile.release]
lto = "thin"
strip = true
