[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openrouter-video-studio"
version = "0.1.0"
description = "A friendly Linux terminal interface for generating videos with OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenRouter Video Studio contributors" }]
keywords = ["openrouter", "video", "textual", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "httpx>=0.28,<0.29",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
  "SecretStorage>=3.3,<4; sys_platform == 'linux'",
  "textual>=4,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
openrouter-video = "openrouter_video_studio.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openrouter_video_studio"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
